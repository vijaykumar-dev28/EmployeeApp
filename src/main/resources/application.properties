spring.application.name=EmployeeApp

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=8778

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret Key
jwt.secret=YOUR_SUPER_SECRET_KEY_ATLEAST_32_CHARS_LONG
jwt.expiration=86400000